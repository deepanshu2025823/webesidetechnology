# Installed at /etc/nginx/sites-available/sahabindia.conf on the VPS.
#
# A new, named server block added alongside the JLS Worldwide vhosts already on
# this box. It claims only its own server_name, and nginx matches a server_name
# before it falls back to a default_server, so the existing catch-all on :80
# keeps every other hostname exactly as it handles them today.
#
# Upstream is 3001 because jls.service already holds 127.0.0.1:3000.
#
# Certbot rewrites this file when the certificate is issued, adding the TLS
# listeners and the redirect. It is checked in HTTP-only because the ACME
# challenge has to be answerable before a certificate exists.

# www.sahabindia.com is the live domain and the canonical one. The apex and both
# .in names redirect to it.
#
# sahabindia.in is claimed here too so that the moment it is registered it lands
# on this site rather than falling through to the catch-all — which is exactly
# how sahabindia.com ended up serving the JLS site the moment its A record was
# pointed at this box.
server {
    listen 80;
    listen [::]:80;
    server_name sahabindia.com sahabindia.in www.sahabindia.in;
    return 308 https://www.sahabindia.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.sahabindia.com;

    # Admin uploads are capped at 8 MB by the application. nginx defaults to
    # 1 MB and would reject the larger ones with a 413 before the app ever
    # sees them.
    client_max_body_size 12M;

    # Prerendered pages stream from the Node server; this keeps nginx from
    # sitting on the response waiting for a buffer to fill.
    proxy_buffering off;
    proxy_http_version 1.1;

    location / {
        proxy_pass http://127.0.0.1:3001;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The app reads this to build canonical URLs and to rate-limit by
        # address; without it every visitor looks like 127.0.0.1.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Upgrade headers are set so the dev-time HMR socket and any future
        # WebSocket route survive the proxy.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Immutable build assets, safe to hold at the edge for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
