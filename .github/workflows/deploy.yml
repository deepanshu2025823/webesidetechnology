name: Build and deploy

# The whole point of this pipeline: the project is built here, and the server
# only ever receives a finished container image from a private registry. Nothing
# is cloned, compiled or stored as source on the VPS.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer commit supersedes a deploy still in flight, rather than the two
  # racing each other onto the server.
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      # Unset, this silently builds canonicals, sitemap entries and Open Graph
      # tags pointing at localhost. Cheaper to stop here than to discover it
      # from Search Console a fortnight later.
      - name: Require the public site URL
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_SITE_URL }}" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_SITE_URL is not set (e.g. https://sahabindia.in)."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          # A BuildKit secret, so the connection string never lands in a layer
          # or in the image history.
          secrets: |
            database_url=${{ secrets.DATABASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Release on the VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The image is in the registry either way. Until the VPS deploy account
      # and its pull token exist, say so and stop, rather than failing the run
      # on a login error that looks like a broken build.
      - id: check
        run: |
          if [ -z "${{ secrets.GHCR_TOKEN }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS release skipped - GHCR_TOKEN or VPS_SSH_KEY is not set. The image was pushed and can be pulled by hand."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull the new image and restart
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Fails the job on any non-zero step, so a broken release is visible
          # here instead of silently leaving the old container running.
          script_stops: true
          script: |
            set -euo pipefail
            cd /opt/sahabindia
            echo "${{ secrets.GHCR_TOKEN }}" \
              | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker logout ghcr.io
